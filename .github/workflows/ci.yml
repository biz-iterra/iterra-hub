name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一ブランチの古い実行は打ち切る（Actions の無料枠を無駄に消費しないため）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 依存インストール
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: ユニットテスト
        run: npm test

      - name: ビルド
        run: npm run build
        env:
          # ビルド時に接続はしないためダミー値で足りる
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key

      # error は 0 件を必須とする。
      # no-explicit-any は既存 205 件を warning に降格し、上限で件数を固定している
      # （ラチェット方式）。増やすと CI が落ちる。減らしたらこの数値も下げること。
      - name: Lint
        run: npm run lint -- --max-warnings 205
