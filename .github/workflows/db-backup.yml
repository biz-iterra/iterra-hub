name: DB Backup

# Supabase Free プランには PITR（ポイントインタイムリカバリ）が無いため、
# 日次で論理バックアップを取得して復旧点を確保する。
# あわせて定期的に DB へ接続するため、無操作によるプロジェクト一時停止も防げる。

on:
  schedule:
    # UTC 18:00 = JST 翌 03:00
    - cron: "0 18 * * *"
  workflow_dispatch: # 手動実行も可能

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Secret は Environment に集約する。台帳: docs/secrets-management.md
    environment: production

    steps:
      # Supabase は PostgreSQL 17。runner 既定の client ではバージョン差で失敗するため明示導入する
      - name: PostgreSQL 17 クライアントを導入
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

          # runner にはより古い client がプリインストールされており、
          # PATH の優先順位によって pg_dump と pg_restore で版が食い違う。
          # 実際に pg_dump(17) のダンプを古い pg_restore が読めず
          # 「unsupported version (1.16) in file header」で失敗した。
          # 17 のディレクトリを PATH の先頭に置いて版を揃える。
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: クライアントの版を確認
        run: |
          echo "pg_dump   : $(command -v pg_dump) / $(pg_dump --version)"
          echo "pg_restore: $(command -v pg_restore) / $(pg_restore --version)"
          # 版が揃っていることを確認（揃っていないとダンプを検証できない）
          test "$(pg_dump --version | grep -oE '[0-9]+' | head -1)" \
             = "$(pg_restore --version | grep -oE '[0-9]+' | head -1)" \
            || { echo "::error::pg_dump と pg_restore のメジャー版が一致していません"; exit 1; }

      - name: ダンプを取得
        env:
          # 接続文字列（postgresql://...）は組み立てない。
          # パスワードに @ & # / : ? が含まれると URL のパースが崩れ、
          # ホスト名が誤認識される（実際に発生済み）。
          # libpq の環境変数で渡せば URL エンコードは不要。
          #
          # Direct connection（db.<ref>.supabase.co）は IPv6 専用で
          # GitHub Actions からも名前解決できないため Session pooler を使う。
          PGHOST: aws-0-ap-northeast-1.pooler.supabase.com
          PGPORT: "5432"
          PGUSER: postgres.aqkesxqxrsucgrnguhnb
          PGDATABASE: postgres
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$PGPASSWORD" ]; then
            echo "::error::secrets.SUPABASE_DB_PASSWORD が未設定です"
            exit 1
          fi
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          # -Fc: カスタム形式（pg_restore で部分復元が可能）
          pg_dump \
            --no-owner --no-privileges \
            --format=custom \
            --file="iterra-hub-$STAMP.dump"
          ls -lh iterra-hub-*.dump

      - name: 取得内容を検証
        run: |
          # 主要テーブルが含まれているかを確認（空ダンプの取り違えを防ぐ）
          pg_restore --list "iterra-hub-$STAMP.dump" > toc.txt
          for t in leads deals contacts companies accounts entity_change_logs; do
            grep -q "TABLE DATA public $t " toc.txt || {
              echo "::error::テーブル $t がダンプに含まれていません"; exit 1; }
          done
          echo "検証 OK: $(wc -l < toc.txt) エントリ"

      - name: アーティファクトとして保管
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.STAMP }}
          path: iterra-hub-*.dump
          retention-days: 30
          if-no-files-found: error

      # 長期保管が必要な場合は Cloudflare R2 等へ退避する（要 secrets 設定）
      # - name: R2 へアップロード
      #   env:
      #     AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      #     AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      #   run: |
      #     aws s3 cp "iterra-hub-$STAMP.dump" \
      #       "s3://${{ secrets.R2_BUCKET }}/iterra-hub/" \
      #       --endpoint-url "${{ secrets.R2_ENDPOINT }}"
