name: Staging Keepalive

# Supabase Free プランは 1 週間アクセスが無いプロジェクトを自動で一時停止する。
# 本番は db-backup.yml の日次実行が結果的に keepalive になっているが、
# STG は使用頻度が低く放置すると必ず停止するため、週 2 回だけ疎通させる。
#
# 停止すると「使いたい時に必ず止まっている」状態になり、復帰に数分かかる。
# 1 回あたり十数秒なので Actions の無料枠への影響は無視できる。

on:
  schedule:
    # UTC 21:00 = JST 翌 06:00。月・木（7 日の閾値に対して余裕を持たせる）
    - cron: "0 21 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Secret は Environment に集約する。台帳: ~/.claude/secrets/ledger/iterra-hub.md
    environment: staging

    steps:
      - name: STG Supabase へ疎通
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Environment 'staging' の Secret が未設定です"
            exit 1
          fi

          # 実テーブルへの SELECT で DB まで到達させる。
          # RLS により anon には行が返らないが、クエリ自体は実行されるため活動として記録される。
          #
          # PostgREST のルート（/rest/v1/）は使わない。OpenAPI スキーマの取得には
          # 昇格した権限が必要で、anon では本番・STG とも 401 になる（実測済み）。
          for i in 1 2 3; do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              -H "apikey: $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/leads?select=id&limit=1" || echo 000)

            if [ "$CODE" = "200" ]; then
              echo "✅ STG 稼働中 (HTTP $CODE)"
              echo "### STG keepalive 成功" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "試行 $i 失敗 (HTTP $CODE)"
            [ "$i" -lt 3 ] && sleep 20
          done

          {
            echo "### STG keepalive 失敗"
            echo ""
            echo "| HTTP | 意味 | 対処 |"
            echo "|---|---|---|"
            echo "| 000 | 到達不可 | プロジェクトが一時停止している可能性。ダッシュボードから再開 |"
            echo "| 401 | キーと URL の不一致 | Environment \`staging\` の URL / ANON_KEY の組み合わせを確認 |"
            echo "| 404 | \`leads\` が存在しない | **マイグレーション未適用**。\`bash scripts/setup-staging.sh\` を実行する |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::STG への疎通が 3 回連続で失敗しました（HTTP $CODE）"
          exit 1
