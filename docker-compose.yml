# ============================================================
# iterra-hub — NAS(UGREEN DXP4800 GT) 上の実行構成
#
# 公開経路: Cloudflare Tunnel（hub.iterra.online）
#   アプリはホストにポートを公開せず、cloudflared からのみ到達させる。
#   NAS の外向き通信だけで成立するため、ルーターのポート開放は不要。
#
# 前提: 同ディレクトリに .env を置く（.env.example を参照）
# 起動: docker compose up -d
# ============================================================

services:
  app:
    # CI でビルドし GHCR へ push したイメージを使う。
    # 切り戻す場合は .env の IMAGE_TAG に sha-<コミットSHA> を指定する。
    image: ghcr.io/biz-iterra/iterra-hub:${IMAGE_TAG:-latest}
    container_name: iterra-hub-app
    restart: unless-stopped

    environment:
      # 外部へ渡す URL（OAuth の redirect_uri 等）の組み立てに使う。
      # プロキシの内側ではリクエストから復元できないため明示する
      APP_ORIGIN: ${APP_ORIGIN:-}

      # サーバー側でのみ使用（RLS をバイパスするため外部に出さない）
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}

      # Gmail 連携。未設定でも起動は通り、連携メニューに「未設定」と出るだけ。
      # 連携を使わない環境で起動を止めないため :? は付けない
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GMAIL_TOKEN_ENCRYPTION_KEY: ${GMAIL_TOKEN_ENCRYPTION_KEY:-}
      # 未設定なら /api/gmail/sync は 503 で無効
      GMAIL_SYNC_CRON_SECRET: ${GMAIL_SYNC_CRON_SECRET:-}

      # 事業者情報の実在確認（国税庁 法人番号 Web-API）
      HOUJIN_BANGOU_APP_ID: ${HOUJIN_BANGOU_APP_ID:-}

      # Cloudflare Access の認証をアプリのログインに引き継ぐ。
      # 両方そろって初めて有効になり、未設定ならログイン画面が出る
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}

      # コーポレートサイトの問い合わせ取込（D1）。
      # 未設定なら /api/leads/inquiry-sync は 503 で無効
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_D1_DATABASE_ID: ${CLOUDFLARE_D1_DATABASE_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      INQUIRY_SYNC_CRON_SECRET: ${INQUIRY_SYNC_CRON_SECRET:-}
      INQUIRY_SYNC_OWNER_EMAIL: ${INQUIRY_SYNC_OWNER_EMAIL:-}

      # freee 会計の取引先突合（読み取り専用）。
      # 未設定なら管理画面が「未設定」と表示し、/api/freee/sync は 503 で無効
      FREEE_CLIENT_ID: ${FREEE_CLIENT_ID:-}
      FREEE_CLIENT_SECRET: ${FREEE_CLIENT_SECRET:-}
      FREEE_TOKEN_ENCRYPTION_KEY: ${FREEE_TOKEN_ENCRYPTION_KEY:-}
      FREEE_SYNC_CRON_SECRET: ${FREEE_SYNC_CRON_SECRET:-}

      # Google コンタクト連携（CRM → Google への push。Phase 1）。
      # Gmail と同じ GCP プロジェクトの**別クライアント**を使う
      # （docs/google-contacts-sync.md §2）。
      # 3 つそろって初めて有効。未設定なら /profile に「未設定」と出るだけ
      GOOGLE_CONTACTS_CLIENT_ID: ${GOOGLE_CONTACTS_CLIENT_ID:-}
      GOOGLE_CONTACTS_CLIENT_SECRET: ${GOOGLE_CONTACTS_CLIENT_SECRET:-}
      GOOGLE_CONTACTS_TOKEN_ENCRYPTION_KEY: ${GOOGLE_CONTACTS_TOKEN_ENCRYPTION_KEY:-}
      # 未設定なら /api/google-contacts/sync は 503 で無効
      GOOGLE_CONTACTS_SYNC_CRON_SECRET: ${GOOGLE_CONTACTS_SYNC_CRON_SECRET:-}
      # 接続を許す Workspace のドメイン。**未設定だと個人アカウントでも繋がる**
      GOOGLE_CONTACTS_ALLOWED_DOMAIN: ${GOOGLE_CONTACTS_ALLOWED_DOMAIN:-}

      TZ: Asia/Tokyo

    healthcheck:
      # /api/health は middleware の認証対象外にしてある
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: iterra-hub-tunnel
    restart: unless-stopped

    # Zero Trust ダッシュボードで発行したトークンで接続する
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
      TZ: Asia/Tokyo

    # アプリが healthy になってから公開する
    depends_on:
      app:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - internal

networks:
  internal:
    driver: bridge
